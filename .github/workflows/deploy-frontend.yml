name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # The frontend ships the policy data as a static file so the map never
      # waits on the API. Rebuild that snapshot from the checked-in seed JSON on
      # every deploy, using the same scripts the backend runs.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Build data snapshot
        run: |
          python backend/scripts/init_db.py
          python backend/scripts/seed_data.py
          python backend/scripts/export_static_data.py

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: frontend

      # Runs against the snapshot the step above just generated, so a data or
      # logic regression fails the deploy rather than shipping.
      - name: Test
        run: npm test
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: https://statescope-1.onrender.com/api

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

      - id: deployment
        uses: actions/deploy-pages@v5
